      C128 391 199 454 283 454
      C339 454 386 423 412 377
      C374 404 333 416 295 405
      C224 386 185 328 195 263
      C204 209 240 174 284 152 Z"/>
    <path d="M319 183
      C362 215 388 258 388 305
      C388 345 371 377 344 401
      C387 380 418 338 418 290
      C418 243 379 199 319 183 Z"/>
    <path d="M292 239 L303 270 L334 281 L303 292 L292 323 L281 292 L250 281 L281 270 Z"/>
    <circle cx="357" cy="212" r="7"/>
  </g>
  <text x="485" y="355" fill="#11100F" font-family="Cormorant Garamond, Didot, 'Bodoni MT', Georgia, serif" font-size="180" font-weight="500" letter-spacing="2">Lunéa</text>
  <path d="M490 400 H1110" stroke="#11100F" stroke-width="1.5" opacity=".34"/>
  <text x="800" y="448" fill="#11100F" font-family="Manrope, Arial, sans-serif" text-anchor="middle" font-size="19" letter-spacing="9">L U N E A   /   SIGNATURE</text>
