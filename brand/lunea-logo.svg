<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="520" viewBox="0 0 1500 520" role="img" aria-labelledby="title desc">
  <title id="title">Lunéa — Minimal Classic Wordmark</title>
  <desc id="desc">A clear classic L monogram paired with the Lunéa wordmark in black on warm ivory.</desc>
  <rect width="1500" height="520" fill="#F4EFE5"/>
  <g fill="#11100F">
    <!-- A simple, unmistakable L: refined serif stem and baseline, with a restrained modern cut. -->
    <path d="M192 126 H330 V148 H287 V352 H384 V394 H192 V370 H244 V148 H192 Z"/>
    <!-- Small cut-out creates a contemporary signature without obscuring the L -->
    <path d="M287 352 L326 352 L384 394 H340 Z" fill="#F4EFE5"/>
    <text x="445" y="350" font-family="Bodoni MT, Didot, 'Times New Roman', serif" font-size="172" font-weight="400" letter-spacing="1">Lunéa</text>
  </g>
</svg>